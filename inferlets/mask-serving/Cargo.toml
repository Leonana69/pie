[package]
name = "mask-serving"
version = "0.1.0"
edition = "2024"
description = "OpenAI-compatible chat-completion service with KV attention masking"

[lib]
crate-type = ["cdylib"]

[dependencies]
inferlet = { path = "../../sdk/rust/inferlet" }
wstd = "0.5.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
